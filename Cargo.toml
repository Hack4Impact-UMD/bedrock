[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
axum = "0.8.9"
lambda_http = "1.3.1"
# rustls with bundled roots: no OpenSSL to cross-compile, works on Lambda.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "tls-rustls-ring-webpki", "chrono", "uuid", "json"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.3", features = ["macros"] }
uuid = {version = "1.28.0", features = ["v4", "serde"] }
anyhow = "1.0.104"
serde = {version = "1.0.229" }
sha2 = "0.11.1"
thiserror = "2.0.21"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"
db = { path = "crates/db" }
identity = { path = "crates/identity" }
aws-config = "1.13.0"
aws-sdk-sesv2 = "1.145.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
