name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bedrock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bedrock
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start AWS emulator
        env:
          EMULATOR_TELEMETRY: "off"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/aws-emulator.deb" \
            https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP/aws-emulator.deb"
          aws-emulator -v
          nohup aws-emulator -p 9297 >"$RUNNER_TEMP/aws-emulator.log" 2>&1 &
          dir="$HOME/.aws/emulator/9297"
          for _ in $(seq 30); do
            [[ -f "$dir/ca.pem" ]] &&
              curl -sf --cacert "$dir/ca.pem" https://127.0.0.1:9297/__admin/health && break
            sleep 1
          done
          curl -sf --cacert "$dir/ca.pem" https://127.0.0.1:9297/__admin/health ||
            { tail -20 "$RUNNER_TEMP/aws-emulator.log"; exit 1; }
          # The Rust SDK trusts certs via SSL_CERT_FILE, which replaces the system
          # store, so combine both or cargo can no longer reach crates.io.
          cat /etc/ssl/certs/ca-certificates.crt "$dir/ca.pem" >"$RUNNER_TEMP/ca-bundle.pem"
          {
            echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297"
            echo "AWS_SHARED_CREDENTIALS_FILE=$dir/emulator_credentials"
            echo "AWS_CONFIG_FILE=$dir/config"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "AWS_DISABLE_HOST_PREFIX_INJECTION=true"
            echo "AWS_REGION=us-east-1"
            echo "SSL_CERT_FILE=$RUNNER_TEMP/ca-bundle.pem"
          } >>"$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - name: AWS emulator log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/aws-emulator.log"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The PyPI package bundles zig, which cargo-lambda uses to cross-compile for arm64.
      - run: pip install cargo-lambda
      - run: cargo lambda build --release --arm64 --bin api --locked

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate
