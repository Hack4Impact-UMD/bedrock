name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    # Queue deploys instead of cancelling: interrupting `terraform apply` can leave state locked.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install cargo-lambda
      - run: cargo lambda build --release --arm64 --bin api --locked --output-format zip

      # Runs before the new code ships, so migrations must stay compatible with the code currently deployed.
      - run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - run: sqlx migrate run --source crates/db/migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra apply -input=false -auto-approve
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_POOLED_URL }}
      - run: echo "Deployed to $(terraform -chdir=infra output -raw api_endpoint)" >> "$GITHUB_STEP_SUMMARY"
