[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
axum = "0.8.9"
lambda_http = "1.3.1"
# rustls with bundled roots: no OpenSSL to cross-compile, works on Lambda.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "tls-rustls-ring-webpki", "chrono", "uuid"] }
tokio = { version = "1.53.3", features = ["macros"] }
uuid = {version = "1.28.0", features = ["v4", "serde"] }
anyhow = "1.0.104"
sha2 = "0.11.1"
db = { path = "crates/db" }

[profile.release]
lto = true
codegen-units = 1
strip = true
