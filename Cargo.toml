[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
axum = "0.8.9"
lambda_http = "1.3.1"
# rustls with bundled roots: no OpenSSL to cross-compile, works on Lambda.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.53.3", features = ["macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
